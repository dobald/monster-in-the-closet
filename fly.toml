# Fly.io: `fly launch --no-deploy --copy-config`, create the volume, set the secrets, `fly deploy`.
# Full steps in README.md → "Deploy". Change `app` to a name of your own.

app = "monster-in-the-closet"
primary_region = "yyz"

[build]

[env]
  MONSTER_MODE = "live"                # real models, behind the daily caps below
  MONSTER_CLOSETS = "device"           # one closet per browser
  MONSTER_VAR_DIR = "/data"            # on the volume: survives redeploys
  MONSTER_MAX_CLOSETS = "200"
  MONSTER_DAILY_CALLS = "300"          # paid requests per day, whole server; then demo mode
  MONSTER_CLOSET_DAILY_CALLS = "25"    # paid requests per day, per closet

# One volume, so one machine: SQLite files and the model cache live here.
[[mounts]]
  source = "monster_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/ping"  # /api/health would open a new closet per probe
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
